<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAND SIM | تحديث وتنشيط الشرائح</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#0f172a;--brand:#2c9cdb;--brand-hover:#1b80b8;--bg-gradient:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%);--card-bg:#ffffff;--text-main:#1e293b;--text-muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg-gradient);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
body[lang="he"]{font-family:'Rubik',sans-serif}
.card{background:var(--card-bg);width:100%;max-width:450px;border-radius:26px;box-shadow:0 20px 45px rgba(0,0,0,0.35);padding:40px 26px 28px;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;right:0;left:0;height:6px;background:linear-gradient(90deg,#2563eb,#38bdf8,#1d4ed8)}
.logo-wrapper{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;direction:ltr}
.logo-icon{background:var(--brand);color:#fff;width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 14px rgba(44,156,219,0.3)}
.logo-text{font-size:30px;font-weight:800;color:var(--primary);letter-spacing:0.5px;font-family:'Rubik',sans-serif}
.logo-text span{color:var(--brand)}
.welcome-title{font-size:22px;font-weight:800;margin-bottom:6px;color:var(--primary)}
.subtitle{font-size:14px;color:var(--text-muted);margin-bottom:26px;line-height:1.6;font-weight:500}
.form-group{text-align:right;margin-bottom:20px}
.form-group label{display:block;font-weight:700;font-size:14px;margin-bottom:8px;color:var(--primary)}
.form-control{width:100%;padding:14px 16px;font-size:20px;font-weight:700;letter-spacing:1.5px;border:2px solid #cbd5e1;border-radius:14px;text-align:center;direction:ltr;color:var(--primary);transition:all 0.2s ease;outline:none;background-color:#f8fafc}
.form-control:focus{background-color:#fff;border-color:var(--brand);box-shadow:0 0 0 4px rgba(44,156,219,0.15)}
.btn-submit{width:100%;padding:15px;font-size:17px;font-weight:700;font-family:inherit;color:#fff;background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);border:none;border-radius:14px;cursor:pointer;transition:all 0.2s ease;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px rgba(37,99,235,0.3)}
.btn-submit:hover{opacity:0.95;transform:translateY(-1px)}
.btn-submit:disabled{background:#94a3b8;cursor:not-allowed;transform:none;box-shadow:none}
.btn-details{width:100%;margin-top:10px;padding:13px;font-size:15px;font-weight:700;font-family:inherit;color:var(--primary);background:#f1f5f9;border:2px solid #cbd5e1;border-radius:14px;cursor:pointer;transition:all 0.2s ease;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-details:hover{background:#e2e8f0;border-color:#94a3b8}
.spinner{display:none}
.btn-submit.loading .spinner{display:inline-block}
.alert-box{margin-top:20px;padding:14px 16px;border-radius:12px;font-size:14px;font-weight:700;display:none;align-items:center;justify-content:center;gap:10px;line-height:1.7;word-break:break-word;white-space:pre-line}
.alert-box.success{display:flex;background-color:#dcfce7;color:#166534;border:1px solid #86efac}
.alert-box.warning{display:flex;background-color:#fffbeb;color:#92400e;border:1px solid #fde68a}
.alert-box.error{display:flex;background-color:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.footer-bar{margin-top:26px;padding-top:16px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}
.lang-btn{color:var(--brand);font-weight:700;font-size:13px;cursor:pointer;padding:5px 14px;border-radius:20px;border:1px solid var(--brand);transition:all 0.2s;user-select:none}
.lang-btn:hover{background-color:var(--brand);color:#fff}
.copyright{color:var(--text-muted);font-size:13px;font-weight:600;direction:ltr}
</style>
</head>
<body lang="ar">
<div class="card">
<div class="logo-wrapper"><div class="logo-icon"><i class="fas fa-sim-card"></i></div><div class="logo-text">BRAND <span>SIM</span></div></div>
<h2 class="welcome-title" id="ui-welcome">مرحباً بك في براند سيم</h2>
<p class="subtitle" id="ui-subtitle">أدخل رقم الهاتف أو الصق نص الرسالة لإجراء تحديث فوري أو معرفة تاريخ انتهاء الحزمة</p>
<form id="customer-refresh-number-form" novalidate>
<div class="form-group">
<label for="customerPhone" id="ui-label">رقم الهاتف</label>
<input type="tel" id="customerPhone" class="form-control" placeholder="05XXXXXXXX" inputmode="numeric" autocomplete="tel" required>
</div>
<button type="submit" id="customSubmitBtn" class="btn-submit"><span id="ui-btn">تحديث الرقم الآن</span><i class="fas fa-sync-alt fa-spin spinner"></i></button>
<button type="button" id="detailsBtn" class="btn-details"><i class="fas fa-calendar-alt"></i><span id="ui-details-btn">تفاصيل الرقم وتاريخ انتهاء الحزمة</span></button>
</form>
<div id="alertBox" class="alert-box"></div>
<div class="footer-bar"><span class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">עברית</span><span class="copyright">BRAND SIM © <script>document.write(new Date().getFullYear())</script></span></div>
</div>
<script>
const LAYAN_API_URL="https://api.layan-t.net/api/Subscribtions/CustomersRefreshNumber";
const AREEN_GAS_URL="https://script.google.com/macros/s/AKfycbxidpoKH8PnhxSvKggQpI2K2BiQQLm7PJM2byXFxnJY1f2Iahqj4UdRfYFuECuqqoPK/exec";
const QUICKLINE_GAS_URL="https://script.google.com/macros/s/AKfycbzoFY7vXfDNsMBieM33Ohym4o3oif6_hoc1FI0RFzKbEgvfALOVMBWQKNt14VOakcQg/exec";
const SKY_PORTAL_URL="https://rn.sky-5g.net";
const LOCAL_PHP_PROXY="https://brand-sim.com/proxy.php";
const NETLIFY_QUERY_URL="https://incredible-crumble-58566c.netlify.app/.netlify/functions/query";
const GITHUB_RAW_DB="https://raw.githubusercontent.com/groupahmed2020-byte/BrandSim.com/main/customers.json";
const i18n={
ar:{welcome:"مرحباً بك في براند سيم",subtitle:"أدخل رقم الهاتف أو الصق نص الرسالة لإجراء تحديث فوري أو معرفة تاريخ انتهاء الحزمة",label:"رقم الهاتف",placeholder:"05XXXXXXXX",btn:"تحديث الرقم الآن",detailsBtn:"تفاصيل الرقم وتاريخ انتهاء الحزمة",loading:"جاري الفحص...",switchBtn:"עברית",invalidPhone:"يرجى إدخال رقم هاتف صحيح مكون من 10 أرقام ويبدأ بـ 05",notAuthorized:"عذراً، هذا الرقم غير مسجل في منظومة براند سيم (BRAND SIM) ولا يمكن تحديثه.",defaultSuccess:"تم إرسال طلب تحديث وتنشيط الرقم بنجاح!",defaultError:"تعذر تحديث الرقم حالياً، يرجى التأكد من الرقم أو المحاولة لاحقاً."},
he:{welcome:"ברוך הבא ל-BRAND SIM",subtitle:"נא להזין מספר טלפון לביצוע רענון أو בדיקת תאריך תפוגת חבילה",label:"מספר טלפון",placeholder:"05XXXXXXXX",btn:"רענון מספר כעת",detailsBtn:"פרטי מספר ותאריך תפוגת חבילה",loading:"בודק...",switchBtn:"العربية",invalidPhone:"נא להזין מספר טלפון תקין בן 10 ספרות המתחיל ב-05",notAuthorized:"מספר זה אינו רשום במערכת BRAND SIM.",defaultSuccess:"המספר רוענן בהצלחה!",defaultError:"פעולת הרענון נכשלה, בדוק את המספר أو نסה شוב."}
};
let currentLang=localStorage.getItem("language")||"ar";
let pastedDetailsIntent=false;
function applyLanguage(lang){
currentLang=lang==="he"?"he":"ar";
localStorage.setItem("language",currentLang);
const t=i18n[currentLang];
document.body.setAttribute("lang",currentLang);
document.getElementById("ui-welcome").textContent=t.welcome;
document.getElementById("ui-subtitle").textContent=t.subtitle;
document.getElementById("ui-label").textContent=t.label;
document.getElementById("customerPhone").placeholder=t.placeholder;
document.getElementById("ui-btn").textContent=t.btn;
document.getElementById("ui-details-btn").textContent=t.detailsBtn;
document.getElementById("langToggleBtn").textContent=t.switchBtn;
}
function toggleLanguage(){document.getElementById("alertBox").style.display="none";applyLanguage(currentLang==="ar"?"he":"ar");}
function hasDetailsKeyword(txt){
if(!txt)return false;
return /(تفاصيل|تفصيل|تاريخ|انتهاء|إنتهاء|تنتهي|ينتهي|بتنتهي|بنتهي|حزمة|حزمه|باقة|باقه|متى|موعد|استعلام|إستعلام|صلاحية|صلاحيه|اشتراك|إشتراك|بيانات|معلومات)/.test(String(txt));
}
function normalizePhoneNumber(rawInput){
if(!rawInput)return "";
let str=rawInput.toString().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
if(str.includes("_"))str=str.split("_")[0];
let cleaned=str.replace(/[\s\-\.\(\)\+\u200B-\u200F\u202A-\u202E\u2066-\u2069]/g,"");
let match=cleaned.match(/(?:00972|00970|972|970|0)?(5\d{8})/);
if(match)return "0"+match[1];
str=cleaned.replace(/[^0-9]/g,"");
if(str.startsWith("00972")||str.startsWith("00970"))str="0"+str.slice(5);
else if((str.startsWith("972")||str.startsWith("970"))&&str.length>=11)str="0"+str.slice(3);
else if(str.length===9&&str.startsWith("5"))str="0"+str;
else if(str.length>10&&str.startsWith("05"))str=str.slice(0,10);
return str;
}
const form=document.getElementById("customer-refresh-number-form"),phoneInput=document.getElementById("customerPhone"),submitBtn=document.getElementById("customSubmitBtn"),detailsBtn=document.getElementById("detailsBtn"),btnText=document.getElementById("ui-btn"),alertBox=document.getElementById("alertBox");
phoneInput.addEventListener("input",e=>{
if(hasDetailsKeyword(e.target.value))pastedDetailsIntent=true;
const normalized=normalizePhoneNumber(e.target.value);
if(e.target.value!==normalized)e.target.value=normalized;
});
function showMessage(type,text){
alertBox.className="alert-box "+type;
const icon=type==="success"?"fa-check-circle":(type==="warning"?"fa-exclamation-triangle":"fa-times-circle");
alertBox.innerHTML='<i class="fas '+icon+'"></i> <span>'+text+'</span>';
alertBox.style.display="flex";
}
window.showMessage=showMessage;

async function queryNetlifyBackend(phone){
if(!phone)return null;
try{
const res=await fetch(NETLIFY_QUERY_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({phone:phone})
});
const json=await res.json();
if(res.ok&&json.ok&&json.data)return json.data;
}catch(e){}
return null;
}

async function findCustomerInSmsDb(cleanPhone,senderPhone=""){
const normTarget=normalizePhoneNumber(cleanPhone);
const normSender=normalizePhoneNumber(senderPhone);
if(normTarget){
const fromApi=await queryNetlifyBackend(normTarget);
if(fromApi)return fromApi;
}
if(normSender&&normSender!==normTarget){
const fromSenderApi=await queryNetlifyBackend(normSender);
if(fromSenderApi)return fromSenderApi;
}
let dbList=[];
try{
const res=await fetch(GITHUB_RAW_DB+"?t="+Date.now(),{cache:"no-store"});
if(res.ok){const remoteData=await res.json();if(Array.isArray(remoteData)&&remoteData.length)dbList=dbList.concat(remoteData);}
}catch(e){}
try{const localData=JSON.parse(localStorage.getItem("xone1_customers_db")||"[]");if(Array.isArray(localData))dbList=dbList.concat(localData);}catch(e){}
let found=null;
if(normTarget){
found=dbList.find(c=>normalizePhoneNumber(c.simPhone||c.phone||c.number||c.mobile||"")===normTarget||normalizePhoneNumber(c.contactPhone||"")===normTarget);
}
if(!found&&normSender){
found=dbList.find(c=>normalizePhoneNumber(c.simPhone||c.phone||c.number||c.mobile||"")===normSender||normalizePhoneNumber(c.contactPhone||"")===normSender);
}
return found||null;
}

function getProviderLabel(customer){
const p=String(customer.sourceProvider||customer.provider||customer.company||"").trim().toLowerCase();
if(p.includes("سكاي")||p.includes("sky"))return "سكاي (Sky)";
if(p.includes("ارين")||p.includes("أرين")||p.includes("areen"))return "أرين (Areen)";
if(p.includes("كويك")||p.includes("quick"))return "كويك لاين (QuickLine)";
if(p.includes("ليان")||p.includes("layan"))return "ليان (Layan)";
return customer.sourceProvider||customer.provider||"براند سيم";
}
function extractExpiryDate(customer){
if(!customer||typeof customer!=="object")return "";
const directKeys=["expiryDate","endDate","expireDate","expDate","expirationDate","packageExpiry","packageEnd","subscriptionEnd","renewalDate","validUntil","validTo","end_date","expiry_date","expire_date","dueDate","finishDate","end","expiry","date","تاريخ الانتهاء","تاريخ_الانتهاء","انتهاء الحزمة","انتهاء_الحزمة","تاريخ انتهاء الحزمة","انتهاء"];
for(const k of directKeys){
if(customer[k]!==undefined&&customer[k]!==null&&String(customer[k]).trim()!==""){
return String(customer[k]).trim().split("T")[0];
}
}
for(const [k,v] of Object.entries(customer)){
if(v===null||v===undefined)continue;
const keyLow=k.toLowerCase();
if(/(exp|end|valid|renew|unti|date|تاريخ|انتهاء|إنتهاء|صلاحية|حزمة|باقة)/.test(keyLow)&&!/^(created|added|updated)/.test(keyLow)){
const valStr=String(v).trim();
if(valStr)return valStr.split("T")[0];
}
}
const dateRegex=/(\d{4}[-\/]\d{1,2}[-\/]\d{1,2}|\d{1,2}[-\/]\d{1,2}[-\/]\d{4})/;
for(const [k,v] of Object.entries(customer)){
if(["id","simPhone","contactPhone","createdAt","addedAt","updatedAt"].includes(k))continue;
const m=String(v||"").match(dateRegex);
if(m)return m[1];
}
return "";
}
function extractPackageName(customer){
const pkgKeys=["packageInfo","package","packageName","plan","planName","bundle","offer","الحزمة","الباقة","حزمة","باقة"];
for(const k of pkgKeys){
if(customer[k]&&String(customer[k]).trim()!=="")return String(customer[k]).trim();
}
return "";
}
function buildDetailsMessage(customer,fallbackPhone){
const sim=normalizePhoneNumber(customer.simPhone||customer.phone||customer.number||fallbackPhone||"");
const expiry=extractExpiryDate(customer);
const pkg=extractPackageName(customer);
let lines=[];
lines.push("تفاصيل الرقم: "+sim);
if(pkg)lines.push("الحزمة: "+pkg);
if(expiry){
lines.push("تاريخ انتهاء الحزمة: "+expiry);
}else{
lines.push("تاريخ انتهاء الحزمة: غير متوفر حالياً في السحبة");
}
return lines.join("\n");
}
async function refreshViaSky(phone,senderPhone){
  // توجيه رقم سكاي مباشرة للعمل عبر التطبيق بالرابط العميق Deep Link
  const appUrl = "brandsim://refresh?phone=" + phone;
  window.location.href = appUrl;
  return { ok: true, isSkyApp: true, msg: "جاري فتح تطبيق BRAND SIM لتحديث شريحة سكاي تلقائياً..." };
}
async function refreshViaAreen(phone){
for(const url of[AREEN_GAS_URL,LOCAL_PHP_PROXY]){
try{
const res=await fetch(url,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({MobNumber:phone,provider:"areen"})});
const data=JSON.parse(await res.text());
const statusCode=data?.StatusCode??data?.statusCode??data?.Status??data?.status;
const message=data?.Message??data?.message??data?.ErrorMessage??data?.errorMessage;
const isSuccess=data?.IsSuccess??data?.isSuccess??(Number(statusCode)===23);
return{ok:Number(statusCode)===23||isSuccess===true,msg:message};
}catch(e){}
}
throw new Error("Areen failed");
}
async function refreshViaQuickLine(phone){
for(const url of[QUICKLINE_GAS_URL,LOCAL_PHP_PROXY]){
try{
const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({phoneNumber:phone,provider:"quickline"})});
const data=await res.json();
return{ok:data.StatusCode>=200&&data.StatusCode<300,msg:(data.Message||"").replace(/^"|"$/g,"").trim()};
}catch(e){}
}
throw new Error("QuickLine failed");
}
async function refreshViaLayan(phone){
const payload=JSON.stringify({number:phone}),headers={"Content-Type":"application/json","Accept":"application/json, text/plain, */*","LANG":currentLang};
let response=null;
for(const url of[LAYAN_API_URL,"https://corsproxy.io/?"+encodeURIComponent(LAYAN_API_URL)]){
try{response=await fetch(url,{method:"POST",headers,body:payload});break;}catch(e){}
}
if(!response)throw new Error("Layan failed");
let responseText=await response.text();
try{const json=JSON.parse(responseText);if(typeof json==="string")responseText=json;else if(json&&(json.message||json.title||json.error))responseText=json.message||json.title||json.error;}catch(_){responseText=responseText.replace(/^"|"$/g,"").trim();}
return{ok:response.ok,msg:responseText};
}
async function executeRefresh(rawNumber,senderPhone="",mode="refresh"){
const t=i18n[currentLang],cleanNumber=normalizePhoneNumber(rawNumber);
if(cleanNumber)phoneInput.value=cleanNumber;
if(mode!=="details"&&!/^05\d{8}$/.test(cleanNumber)){showMessage("warning",t.invalidPhone);return;}
if(mode==="details"&&!cleanNumber&&!senderPhone){showMessage("warning",t.invalidPhone);return;}
submitBtn.disabled=true;detailsBtn.disabled=true;submitBtn.classList.add("loading");btnText.textContent=t.loading;alertBox.style.display="none";
try{
const customer=await findCustomerInSmsDb(cleanNumber,senderPhone);
if(!customer){
showMessage("error",t.notAuthorized);
if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
window.AndroidBridge.sendSmsReply(senderPhone,t.notAuthorized);
}
return;
}
if(mode==="details"){
const detailsMsg=buildDetailsMessage(customer,cleanNumber);
showMessage("success",detailsMsg);
if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
window.AndroidBridge.sendSmsReply(senderPhone,detailsMsg);
}
return;
}
const targetSim=normalizePhoneNumber(customer.simPhone||customer.phone||customer.number||cleanNumber);
const provider=String(customer.sourceProvider||"").trim().toLowerCase();
let result;
if(provider.includes("سكاي")||provider.includes("sky"))result=await refreshViaSky(targetSim,senderPhone);
else if(provider.includes("ارين")||provider.includes("أرين")||provider.includes("areen"))result=await refreshViaAreen(targetSim);
else if(provider.includes("كويك")||provider.includes("quick"))result=await refreshViaQuickLine(targetSim);
else result=await refreshViaLayan(targetSim);
const finalSiteMsg=(result.msg||"").trim()||(result.ok?t.defaultSuccess:t.defaultError);
if(result.ok){
showMessage("success",finalSiteMsg);
if(!result.isSkyApp)phoneInput.value="";
}else{
showMessage("warning",finalSiteMsg);
}
if(senderPhone&&!result.isSkyApp&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
window.AndroidBridge.sendSmsReply(senderPhone,finalSiteMsg);
}
}catch(err){
showMessage("error",t.defaultError);
if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
window.AndroidBridge.sendSmsReply(senderPhone,t.defaultError);
}
}finally{
pastedDetailsIntent=false;
submitBtn.disabled=false;detailsBtn.disabled=false;submitBtn.classList.remove("loading");btnText.textContent=t.btn;
}
}
window.executeSmsAutoRefresh=function(targetPhone,senderPhone,mode){
executeRefresh(targetPhone,senderPhone,mode||"refresh");
};
form.addEventListener("submit",e=>{
e.preventDefault();
executeRefresh(phoneInput.value,"",pastedDetailsIntent?"details":"refresh");
});
detailsBtn.addEventListener("click",()=>{
executeRefresh(phoneInput.value,"","details");
});
window.addEventListener("DOMContentLoaded",()=>{
const params=new URLSearchParams(window.location.search);
applyLanguage(params.get("lang")||currentLang);
const urlNumber=params.get("number")||params.get("phone");
const modeParam=params.get("mode")==="details"?"details":"refresh";
if(urlNumber){phoneInput.value=normalizePhoneNumber(urlNumber);if(params.get("auto")==="1"||params.get("auto")==="true")executeRefresh(urlNumber,"",modeParam);}
});
</script>
</body>
</html>
